<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alarm mid-flip freeze (two-phase)</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: Inter, Helvetica Neue, sans-serif; }
    body { display: grid; place-items: center; }
    .page { width: 100%; height: 100%; display: grid; place-items: center; }
    .page.light { background: #E7E5E0; }
    .page.dark { background: #0B0B0B; }
    .clock {
      width: 480px; border-radius: 8px; padding: 26px 22px 29px; position: relative;
      box-shadow: 0 10px 22px rgba(40,32,24,0.07);
    }
    .light .clock { background: #F4F3F0; border: 1px solid rgba(40,32,24,0.1); }
    .dark .clock { background: #121212; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
    .handle { position: absolute; left: 29%; right: 29%; top: -28px; height: 35px; }
    .handle svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .feet { display: flex; justify-content: space-between; width: 58%; margin: 2px auto 0; }
    .foot { width: 28px; height: 8px; border-radius: 1px; background: #C45C26; opacity: 0.9; }
    .face {
      position: relative; overflow: hidden; border-radius: 6px; padding: 26px 22px 25px;
      display: flex; justify-content: center;
    }
    .light .face {
      background: #FFFEFB;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -12px 20px rgba(40,32,24,0.045), inset 0 0 0 1px rgba(40,32,24,0.07);
    }
    .dark .face {
      background: rgba(255,255,255,0.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 -10px 18px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .row { display: flex; gap: 9px; align-items: flex-start; justify-content: center; }
    .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .digits { display: flex; font-size: 49px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.92; font-variant-numeric: tabular-nums; }
    .light .digits { color: #0A0A0A; }
    .dark .digits { color: #F4F3F0; }
    .digit {
      position: relative; width: 0.62em; height: 1em; overflow: hidden;
      display: inline-flex; perspective: 900px; transform-style: preserve-3d;
    }
    .glyph {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden; transform-origin: 50% 50%;
    }
    /* Mid of top phase: new underlay, old bottom static, old top at −45° */
    .under { z-index: 1; }
    .old-bot { clip-path: inset(50% 0 0 0); z-index: 2; }
    .old-top {
      clip-path: inset(0 0 50% 0); transform-origin: 50% 100%;
      transform: perspective(900px) rotateX(-52deg); opacity: 0.95; z-index: 3;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.55));
    }
    .hinge {
      position: absolute; left: 16%; right: 16%; top: 50%; height: 1.25px;
      transform: translateY(-50%); opacity: 0.55; z-index: 4;
    }
    .light .old-top { filter: drop-shadow(0 1px 0.5px rgba(0,0,0,0.12)); }
    .light .hinge { background: #0A0A0A; opacity: 0.38; height: 1px; left: 18%; right: 18%; }
    .dark .hinge { background: #F4F3F0; }
    .label { font-size: 7px; letter-spacing: 0.08em; font-weight: 500; }
    .light .label { color: #6B6B6B; }
    .dark .label { color: rgba(244,243,240,0.5); }
    .colon { display: flex; flex-direction: column; gap: 8px; height: 49px; margin-top: 6px; opacity: 0.34; justify-content: center; align-items: center; }
    .colon i { width: 2px; height: 3px; border-radius: 0.6px; display: block; }
    .light .colon i { background: #0A0A0A; }
    .dark .colon i { background: #F4F3F0; }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="wrap">
      <div class="clock">
        <div class="handle"><svg viewBox="0 0 100 32" preserveAspectRatio="xMidYMax meet"><path d="M16 30 V14 C16 5 30 2 50 2 C70 2 84 5 84 14 V30" fill="none" stroke="#C45C26" stroke-width="2.4" stroke-linecap="round"/><circle cx="50" cy="2.2" r="2.1" fill="#C45C26"/></svg></div>
        <div class="face">
          <div class="row">
            <div class="unit"><div class="digits"><span class="digit"><span class="glyph">0</span></span><span class="digit"><span class="glyph">2</span></span></div><div class="label">Days</div></div>
            <div class="colon"><i></i><i></i></div>
            <div class="unit"><div class="digits"><span class="digit"><span class="glyph">1</span></span><span class="digit"><span class="glyph">7</span></span></div><div class="label">Hours</div></div>
            <div class="colon"><i></i><i></i></div>
            <div class="unit"><div class="digits"><span class="digit"><span class="glyph">4</span></span><span class="digit"><span class="glyph">5</span></span></div><div class="label">Minutes</div></div>
            <div class="colon"><i></i><i></i></div>
            <div class="unit"><div class="digits"><span class="digit"><span class="glyph">0</span></span>
              <span class="digit" id="mid">
                <span class="glyph under">9</span>
                <span class="glyph old-bot">8</span>
                <span class="glyph old-top">8</span>
                <span class="hinge"></span>
              </span>
            </div><div class="label">Seconds</div></div>
          </div>
        </div>
      </div>
      <div class="feet"><span class="foot"></span><span class="foot"></span></div>
    </div>
  </div>
  <script>
    const theme = new URLSearchParams(location.search).get("theme") || "dark"
    document.getElementById("page").classList.add(theme)
  </script>
</body>
</html>
