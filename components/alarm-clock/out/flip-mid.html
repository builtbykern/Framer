<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alarm mid-flip freeze</title>
  <style>
    html, body { margin: 0; height: 100%; background: #E7E5E0; font-family: Inter, Helvetica Neue, sans-serif; }
    body { display: grid; place-items: center; }
    .clock {
      width: 480px; background: #F4F3F0; border: 1px solid rgba(40,32,24,0.1);
      border-radius: 14px; padding: 26px 22px 28px; position: relative;
      box-shadow: 0 10px 22px rgba(40,32,24,0.07);
    }
    .handle { position: absolute; left: 34%; right: 34%; top: -20px; height: 22px; }
    .handle svg { width: 100%; height: 100%; overflow: visible; }
    .feet { display: flex; justify-content: space-between; width: 62%; margin: -2px auto 0; }
    .foot { width: 22px; height: 4px; background: #C45C26; border-radius: 1px; opacity: 0.9; }
    .face {
      background: #FFFEFB; border-radius: 8px; padding: 22px 14px 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -12px 20px rgba(40,32,24,0.045), inset 0 0 0 1px rgba(40,32,24,0.07);
      display: flex; justify-content: center; gap: 12px;
    }
    .unit { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pair { display: flex; font-size: 71px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.92; color: #0A0A0A; font-variant-numeric: tabular-nums; }
    .label { color: #6B6B6B; font-size: 10px; letter-spacing: 0.08em; font-weight: 500; }
    .digit {
      position: relative; width: 0.62em; height: 1.05em; perspective: 720px; display: inline-block;
    }
    .half-top, .half-bot {
      position: absolute; left: 0; right: 0; overflow: hidden; height: 50%;
    }
    .half-top { top: 0; }
    .half-bot { top: 50%; }
    .glyph {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 200%;
    }
    .half-bot .glyph { margin-top: -100%; }
    .flap {
      position: absolute; left: 0; right: 0; top: 0; height: 50%;
      transform-origin: 50% 100%; transform-style: preserve-3d;
      transform: rotateX(-92deg);
      z-index: 3;
    }
    .flap-face {
      position: absolute; inset: 0; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .flap-back { transform: rotateX(180deg); }
    .hinge {
      position: absolute; left: 12%; right: 12%; top: 50%; height: 1.5px;
      background: #0A0A0A; opacity: 0.28; transform: translateY(-50%); z-index: 4;
    }
    .colon { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 2px; height: 74px; opacity: 0.35; }
    .colon i { width: 3px; height: 3px; border-radius: 50%; background: #0A0A0A; display: block; }
  </style>
</head>
<body>
  <div class="clock">
    <div class="handle" aria-hidden="true">
      <svg viewBox="0 0 100 28" fill="none">
        <path d="M18 26 C18 10, 82 10, 82 26" stroke="#C45C26" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="50" cy="2.5" r="2.4" fill="#C45C26"/>
      </svg>
    </div>
    <div class="face">
      <div class="unit">
        <div class="pair"><span>0</span><span>2</span></div>
        <div class="label">Days</div>
      </div>
      <div class="colon" aria-hidden="true"><i></i><i></i></div>
      <div class="unit">
        <div class="pair"><span>1</span><span>7</span></div>
        <div class="label">Hours</div>
      </div>
      <div class="colon" aria-hidden="true"><i></i><i></i></div>
      <div class="unit">
        <div class="pair"><span>4</span><span>5</span></div>
        <div class="label">Minutes</div>
      </div>
      <div class="colon" aria-hidden="true"><i></i><i></i></div>
      <div class="unit">
        <div class="pair">
          <span>0</span>
          <span class="digit" id="flip">
            <span class="half-top"><span class="glyph">8</span></span>
            <span class="half-bot"><span class="glyph">8</span></span>
            <span class="flap">
              <span class="flap-face"><span class="glyph">7</span></span>
              <span class="flap-face flap-back"><span class="glyph">8</span></span>
            </span>
            <span class="hinge"></span>
          </span>
        </div>
        <div class="label">Seconds</div>
      </div>
    </div>
    <div class="feet" aria-hidden="true"><span class="foot"></span><span class="foot"></span></div>
  </div>
</body>
</html>
