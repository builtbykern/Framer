<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Thinking Orbs — idle clip</title>
  <style>
    html, body { margin: 0; height: 100%; background: #E8E2D6; }
    #stage {
      position: relative;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      background: #E8E2D6;
      isolation: isolate;
    }
    .orb { position: absolute; pointer-events: none; }
    .bloom, .core {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }
    .bloom { inset: -8%; opacity: 0.35; }
    .core { inset: 14%; opacity: 0.92; }
    .meta {
      position: absolute;
      left: 48px;
      bottom: 40px;
      font-family: Geist, Inter, system-ui, sans-serif;
      z-index: 2;
    }
    .eye {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: rgb(110, 104, 94);
    }
    .cap {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: rgb(62, 56, 48);
    }
    .cta {
      position: absolute;
      right: 22px;
      bottom: 20px;
      z-index: 2;
      font-family: Geist, Inter, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(46, 42, 36, 0.42);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="orbs"></div>
    <div class="meta">
      <p class="eye">THINKING ORBS</p>
      <p class="cap">Idle, then still.</p>
    </div>
    <a class="cta" href="https://framer.link/qIg9LiG" target="_blank" rel="noopener noreferrer">Made for Framer</a>
  </div>
  <script>
    const REST = [
      { x: 0.47, y: 0.5, size: 1, phase: 0.12 },
      { x: 0.545, y: 0.425, size: 0.66, phase: 1.7 },
      { x: 0.515, y: 0.565, size: 0.52, phase: 2.9 },
    ]
    const PERIOD_X = [13.7, 17.1, 21.4]
    const PERIOD_Y = [16.3, 13.9, 19.2]
    const PERIOD_S = [9.4, 11.2, 13.6]
    const COLORS = ["#B06A3C", "#4F6A52", "#3A4C6B"]
    const SIZE_MIN = 120
    const SIZE_MAX = 240
    const BLUR = 16
    const DRIFT = 28
    const SPEED = 0.55
    const BOX = 900

    function linger(t) {
      const s = Math.sin(t)
      return s * s * s
    }
    function mix(a, b, t) {
      const p = (hex) => [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
      ]
      const A = p(a), B = p(b)
      const ch = (i) => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, "0")
      return `#${ch(0)}${ch(1)}${ch(2)}`
    }

    const fit = Math.min(BOX * 0.62, SIZE_MAX)
    const maxSize = Math.max(48, fit)
    const minSize = Math.min(Math.max(32, SIZE_MIN), maxSize)
    const host = document.getElementById("orbs")
    const nodes = REST.map((slot, i) => {
      const size = minSize + (maxSize - minSize) * slot.size
      const color = COLORS[i]
      const highlight = mix(color, "#FFF8EE", 0.32)
      const core = mix(color, "#1C1814", 0.08)
      const wrap = document.createElement("div")
      wrap.className = "orb"
      wrap.style.left = `${slot.x * 100}%`
      wrap.style.top = `${slot.y * 100}%`
      wrap.style.width = `${size}px`
      wrap.style.height = `${size}px`
      wrap.style.marginLeft = `${-size / 2}px`
      wrap.style.marginTop = `${-size / 2}px`
      wrap.innerHTML = `
        <div class="bloom" style="background:radial-gradient(circle at 38% 34%, ${color} 0%, transparent 70%);filter:blur(${BLUR}px)"></div>
        <div class="core" style="background:radial-gradient(circle at 36% 32%, ${highlight} 0%, ${core} 42%, ${color} 58%, transparent 72%);filter:blur(${Math.max(4, Math.round(BLUR * 0.38))}px)"></div>
      `
      host.appendChild(wrap)
      return { el: wrap, slot, i }
    })

    const start = performance.now()
    function tick(now) {
      const t = ((now - start) / 1000) * SPEED
      for (const n of nodes) {
        const dx = linger((t * Math.PI * 2) / PERIOD_X[n.i] + n.slot.phase) * DRIFT
        const dy = linger((t * Math.PI * 2) / PERIOD_Y[n.i] + n.slot.phase * 1.37) * DRIFT * 0.72
        const scale = 1 + linger((t * Math.PI * 2) / PERIOD_S[n.i] + n.slot.phase) * 0.045
        n.el.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${scale})`
      }
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  </script>
</body>
</html>
